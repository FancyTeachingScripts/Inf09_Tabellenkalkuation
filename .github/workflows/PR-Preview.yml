name: PR Preview – Compile PDFs

on:
  pull_request:
    branches: [ master, main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  compile-preview:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        texfile:
          - presentation_noaufraeumen.tex
          - print_students-cover.tex
          - print_solution-cover.tex
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile ${{ matrix.texfile }}
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: 2024
          os: debian
          run: |
            lualatex -interaction=nonstopmode main/${{ matrix.texfile }} || true
            lualatex -interaction=nonstopmode main/${{ matrix.texfile }} || true

      - name: Get base filename
        id: basename
        run: |
          basename="${{ matrix.texfile }}"
          basename="${basename%.tex}"
          echo "basename=$basename" >> $GITHUB_OUTPUT

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ steps.basename.outputs.basename }}
          path: ${{ steps.basename.outputs.basename }}.pdf
          retention-days: 7
          compression-level: 0

  comment-on-pr:
    needs: compile-preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all compiled PDFs
        uses: actions/download-artifact@v4
        with:
          pattern: "preview-*"
          merge-multiple: true
          path: downloaded-pdfs

      - name: Publish PDFs to previews branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin previews; then
            git fetch origin previews
            git checkout previews
          else
            git checkout --orphan previews
            git rm -rf . || true
          fi

          PR_DIR="pr-${{ github.event.pull_request.number }}"
          mkdir -p "$PR_DIR"
          cp downloaded-pdfs/*.pdf "$PR_DIR/"

          git add "$PR_DIR"/*.pdf
          git commit -m "Update previews for PR #${{ github.event.pull_request.number }} (${GITHUB_SHA::7})" || echo "No changes to commit"
          git push origin previews || (git pull origin previews --rebase && git push origin previews)

          # Purge jsDelivr cache so preview updates instantly
          for f in "$PR_DIR"/*.pdf; do
            curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@previews/$f" > /dev/null || true
          done

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

            const prNumber = context.issue.number;
            const rows = artifacts.data.artifacts
              .filter(a => a.name.startsWith('preview-'))
              .map(a => {
                const pdfName = a.name.replace('preview-', '') + '.pdf';
                const viewUrl = `https://cdn.jsdelivr.net/gh/${context.repo.owner}/${context.repo.repo}@previews/pr-${prNumber}/${pdfName}`;
                const downloadUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${a.id}`;
                return `| \`${pdfName}\` | [👁 Open in Browser Viewer](${viewUrl}) | [⬇ Download ZIP](${downloadUrl}) |`;
              })
              .join('\n');

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);

            const body = [
              '<!-- pdf-preview-bot -->',
              '### 📄 PDF Preview',
              `Compiled for commit \`${sha}\` — [View Actions run](${runUrl})`,
              '',
              '| PDF | In-Browser View | Download |',
              '|-----|-----------------|----------|',
              rows,
              '',
              `_Updated: ${new Date().toUTCString()}_`,
            ].join('\n');

            const issue_number = context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
            });

            const existing = comments.find(c => c.body.startsWith('<!-- pdf-preview-bot -->'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                body,
              });
            }
